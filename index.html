<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zax songs</title>

    <style>
        /* Animação do fundo alternando entre preto e vermelho escuro */
        @keyframes fundoAnimado {
            0%   { background-color: #0b0b0b; } 
            50%  { background-color: #2b0000; } 
            100% { background-color: #0b0b0b; } 
        }

        /* Animação das bordas trocando de cor (RGB Gamer) */
        @keyframes efeitoRGB {
            0%   { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; } 
            33%  { border-color: #9400d3; box-shadow: 0 0 15px #9400d3; } 
            66%  { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; } 
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; } 
        }

        /* Animação extra para fazer o brilho estelar dos vídeos pulsar */
        @keyframes brilhoEstelar {
            0%   { box-shadow: 0 0 15px #ffd700; border-color: #ffd700; }
            50%  { box-shadow: 0 0 30px #ff8c00, 0 0 10px #ffd700; border-color: #ff8c00; }
            100% { box-shadow: 0 0 15px #ffd700; border-color: #ffd700; }
        }

        body {
            border: 8px solid #ff0000;  
            padding: 20px;             
            font-family: sans-serif;   
            color: #ffffff;            
            animation: fundoAnimado 10s ease-in-out infinite, efeitoRGB 6s linear infinite;
            position: relative; 
            overflow-x: hidden; 
        }

        /* Coleção de figurinhas do Brocasito */
        .figurinha {
            position: absolute; 
            width: 75px;        
            height: auto;
            border-radius: 50px;     
            border: 2px solid #fff;  
            z-index: 1;         
            opacity: 0.6;       
        }

        .f1 { top: 120px; left: 5%; }
        .f2 { top: 250px; right: 4%; }
        .f3 { top: 600px; left: 3%; }
        .f4 { top: 900px; right: 5%; }
        .f5 { top: 1300px; left: 4%; }
        .f6 { bottom: 150px; right: 3%; }

        h1 {
            color: #ff0000;            
            text-align: center;        
            font-size: 45px;           
            text-transform: uppercase; 
            text-shadow: 0 0 15px #ff0000;
            margin-bottom: 5px;
        }

        .lema {
            text-align: center;
            font-size: 22px;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff0000;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .caixa-pesquisa {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 10; 
        }

        .caixa-pesquisa input {
            width: 80%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #1a1a1a;
            border: 2px solid #ff0000;
            border-radius: 25px; 
            color: white;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            transition: 0.3s;
        }

        .caixa-pesquisa input:focus {
            border-color: #00ff00; 
            box-shadow: 0 0 15px #00ff00;
        }

        /* MUDANÇA: Nomes dos artistas em cima das músicas e muito maiores! */
        h2 {
            font-size: 48px; /* Letra bem grande e de destaque */
            color: #ffffff;            
            border-left: 8px solid #ff0000; /* Linha lateral mais grossa */
            padding-left: 15px;        
            margin-top: 50px;          
            margin-bottom: 20px; /* Garante que fique bem em cima das músicas */
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            position: relative;
            z-index: 5;
            text-transform: uppercase;
        }

        .texto-branco {
            color: #ffffff !important;
            border-left: 8px solid #ffffff; 
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
        }

        h3 {
            color: #ff3333;
            font-size: 20px;
            margin-top: 25px;
            position: relative;
            z-index: 5;
        }

        ul {
            list-style-type: "🎵 "; 
            padding-left: 20px;
            position: relative;
            z-index: 5;
        }

        a {
            color: #00bfff;
            text-decoration: none; 
            font-weight: bold;
        }

        a:hover {
            color: #ffffff;
            text-shadow: 0 0 5px #00bfff;
        }

        .galeria-videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
        }

        /* MUDANÇA: Efeito de estrela brilhante ao redor das músicas */
        iframe {
            width: 450px;
            height: 250px;
            max-width: 100%; 
            border: 4px solid #ffd700; /* Borda dourada linda */
            border-radius: 12px;
            /* Ativa a animação que faz a "estrela" dourada ao redor pulsar de brilho */
            animation: brilhoEstelar 3s ease-in-out infinite; 
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 25px;
            font-size: 18px;
            border-top: 2px dashed #ff0000;
            color: #ffffff;
            text-shadow: 0 0 10px #ff0000;
            position: relative;
            z-index: 5;
        }
    </style>
</head>
