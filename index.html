<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zax songs</title>

    <style>
        /* Animação do fundo alternando entre preto e vermelho escuro */
        @keyframes fundoAnimado {
            0%   { background-color: #0b0b0b; } 
            50%  { background-color: #2b0000; } 
            100% { background-color: #0b0b0b; } 
        }

        /* Animação das bordas trocando de cor (RGB Gamer) */
        @keyframes efeitoRGB {
            0%   { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; } 
            33%  { border-color: #9400d3; box-shadow: 0 0 15px #9400d3; } 
            66%  { border-color: #0000ff; box-shadow: 0 0 15px #0000ff; } 
            100% { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; } 
        }

        body {
            border: 8px solid #ff0000;  
            padding: 20px;             
            font-family: sans-serif;   
            color: #ffffff;            
            animation: fundoAnimado 10s ease-in-out infinite, efeitoRGB 6s linear infinite;
            position: relative; /* Necessário para espalhar as figurinhas pelo fundo */
            overflow-x: hidden; /* Evita que a tela fique arrastando para os lados por causa dos stickers */
        }

        /* Estilo para a coleção de muitas figurinhas do Brocasito */
        .figurinha {
            position: absolute; /* Gruda no fundo da página */
            width: 75px;        /* Tamanho ideal de adesivo */
            height: auto;
            border-radius: 50px;     
            border: 2px solid #fff;  
            z-index: 1;         /* Fica atrás dos vídeos para não atrapalhar */
            opacity: 0.6;       /* Transparência estilosa de fundo */
        }

        /* Posicionando cada uma das várias figurinhas */
        .f1 { top: 120px; left: 5%; }
        .f2 { top: 250px; right: 4%; }
        .f3 { top: 600px; left: 3%; }
        .f4 { top: 900px; right: 5%; }
        .f5 { top: 1300px; left: 4%; }
        .f6 { bottom: 150px; right: 3%; }

        h1 {
            color: #ff0000;            
            text-align: center;        
            font-size: 45px;           
            text-transform: uppercase; 
            text-shadow: 0 0 15px #ff0000;
            margin-bottom: 5px;
        }

        /* Estilo do seu novo título/lema "rep e vida" */
        .lema {
            text-align: center;
            font-size: 22px;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff0000;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Truque da Barra de Pesquisa */
        .caixa-pesquisa {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 10; /* Fica sempre na frente */
        }

        .caixa-pesquisa input {
            width: 80px;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #1a1a1a;
            border: 2px solid #ff0000;
            border-radius: 25px; /* Deixa as pontas arredondadas e modernas */
            color: white;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            transition: 0.3s;
        }

        /* Quando clica para digitar, a barra brilha mais forte! */
        .caixa-pesquisa input:focus {
            width: 100%;
            border-color: #00ff00; /* Muda para verde gamer ao clicar! */
            box-shadow: 0 0 15px #00ff00;
        }

        h2 {
            font-size: 32px;           
            color: #ffffff;            
            border-left: 5px solid #ff0000; 
            padding-left: 10px;        
            margin-top: 40px;          
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 20px #ff0000;
            position: relative;
            z-index: 5;
        }

        .texto-branco {
            color: #ffffff !important;
            border-left: 5px solid #ffffff; 
            text-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff;
        }

        h3 {
            color: #ff3333;
            font-size: 20px;
            margin-top: 20px;
            position: relative;
            z-index: 5;
        }

        ul {
            list-style-type: "🎵 "; 
            padding-left: 20px;
            position: relative;
            z-index: 5;
        }

        a {
            color: #00bfff;
            text-decoration: none; 
            font-weight: bold;
        }

        a:hover {
            color: #ffffff;
            text-shadow: 0 0 5px #00bfff;
        }

        .galeria-videos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
        }

        iframe {
            width: 450px;
            height: 250px;
            max-width: 100%; 
            border: 3px solid #ff0000; 
            border-radius: 8px;
            animation: efeitoRGB 6s linear infinite;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 15px;
            font-size: 18px;
            border-top: 2px dashed #ff0000;
            color: #ffffff;
            text-shadow: 0 0 10px #ff0000;
            position: relative;
            z-index: 5;
        }
    </style>
</head>
